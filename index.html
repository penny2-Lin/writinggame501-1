<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>議論文寫作闖關地圖：主角覺醒之路</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* 全局字體設定 */
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        /* RPG 標題專用字體 */
        .rpg-font {
            font-family: 'DotGothic16', sans-serif;
        }
        
        /* 簡單的動畫效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        /* 滾動條樣式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen selection:bg-purple-500 selection:text-white pb-20">

    <div id="app"></div>

    <script>
        // --- 遊戲資料庫 (Data) ---
        const stances = [
            {
                id: 'A',
                title: '屬性 A：養分系',
                desc: '失敗與逆境是成長中最重要的養分。',
                icon: 'scroll',
                color: 'border-green-500 bg-green-900/20',
                hint: '既然選擇了「養分系」，請強調失敗如何成為未來的肥料。',
                sentencePattern: '雖然（遭遇失敗）...，但是（這反而成為了...）'
            },
            {
                id: 'B',
                title: '屬性 B：經驗系',
                desc: '從失敗中獲得體悟，能幫助我們累積經驗與能力。',
                icon: 'sword',
                color: 'border-blue-500 bg-blue-900/20',
                hint: '既然選擇了「經驗系」，請強調從錯誤中學到了具體的方法。',
                sentencePattern: '不僅（經歷了失敗）...，而且（學會了...）'
            },
            {
                id: 'C',
                title: '屬性 C：信心系',
                desc: '失敗能讓我們更樂觀與自信地面對未來。',
                icon: 'shield',
                color: 'border-yellow-500 bg-yellow-900/20',
                hint: '既然選擇了「信心系」，請強調跨越障礙後的心態轉變。',
                sentencePattern: '正因為（克服了...），所以（更加確信...）'
            }
        ];

        const mentors = [
            {
                id: 'LiAng',
                name: '國際導演 李安',
                failure: '兩次大學聯考落榜，畢業後六年找不到工作',
                solution: '檢視現況並思考如何扳回頹勢，從挫折中學習成長',
                result: '作品揚名國際。',
                icon: 'clapperboard',
                imgColor: 'bg-indigo-600'
            },
            {
                id: 'LinYang',
                name: '羽球金牌 麟洋配',
                failure: '奧運首場敗北陷入低潮，被分在不被看好的「死亡之組」',
                solution: '頂住外界壓力的議論聲，彼此溝通調整作戰策略',
                result: '奧運史上首組連霸的男雙金牌。',
                icon: 'trophy',
                imgColor: 'bg-yellow-600'
            },
            {
                id: 'ChefChiang',
                name: '名廚 江振誠',
                failure: '語言不通，每天工作 18 小時並睡在倉庫地板',
                solution: '咬緊牙關，反覆做好煮馬鈴薯等每一個細節',
                result: '成為世界前五十大名廚。',
                icon: 'utensils',
                imgColor: 'bg-red-600'
            },
            {
                id: 'BoxerChen',
                name: '拳擊女王 陳念琴',
                failure: '奧運十六強止步，備戰時卻不幸得到癌症',
                solution: '忍受化療副作用的痛苦，在體能變差時仍堅持不斷訓練',
                result: '在巴黎奧運獲得銅牌。',
                icon: 'swords',
                imgColor: 'bg-pink-600'
            }
        ];

        const argumentQuotes = [
            {
                text: "社會教我們往往是如何迎向成功，誰教我們面對失敗？",
                author: "戴資穎（羽球球后）",
                analysis: "這句話非常適合用來「點題」。小戴點出了一個很棒的思考點：學校都在教怎麼贏，但學會「輸」其實更重要。",
                usage: "正如羽球球后戴資穎所言：「社會教我們往往是如何迎向成功，誰教我們面對失敗？」在成長的路上，學會如何面對挫折，或許比學會如何贏得比賽更為關鍵。"
            },
            {
                text: "本來無望的事，大膽嘗試，往往能成功。",
                author: "莎士比亞（英國劇作家）",
                analysis: "很多時候我們是因為害怕失敗才不敢行動。莎士比亞鼓勵我們，就算看起來沒希望，也要勇敢試試看。",
                usage: "不要因為害怕失敗而卻步，莎士比亞曾說：「本來無望的事，大膽嘗試，往往能成功。」只有踏出第一步，我們才有機會看見成長的風景。"
            },
            {
                text: "一切的壓力、挑戰和所有消極的事物，對我而言都是成功的機會！",
                author: "科比‧布萊恩（Kobe Bryant，NBA傳奇球星）",
                analysis: "這就是著名的「曼巴精神」。把所有不好的事情（壓力、失敗）都看成是讓自己升級的「機會」。",
                usage: "面對逆境時，我們應當學習科比的精神：「一切的壓力、挑戰和所有消極的事物，對我而言都是成功的機會！」將絆腳石轉化為墊腳石。"
            },
            {
                text: "失敗為成功之母。",
                author: "古諺語（必備經典）",
                analysis: "這是最基礎但也最好用的句子。",
                usage: "俗話說：「失敗為成功之母。」每一次的跌倒，其實都是為了下一次跑得更快而做的準備。"
            },
            {
                text: "我沒有失敗，我只是發現了一萬種行不通的方法。",
                author: "愛迪生（Thomas Edison，發明大王）",
                analysis: "愛迪生發明燈泡失敗了非常多次。這句話教我們要樂觀，把失敗看成是一種「發現」。",
                usage: "面對挫折，我們應該學習愛迪生的精神：「我沒有失敗，只是發現了一萬種行不通的方法。」只要換個角度想，失敗也是一種收穫。"
            },
            {
                text: "不經一事，不長一智。",
                author: "曹雪芹《紅樓夢》（中國俗諺）",
                analysis: "沒有經歷過某件事（包含失敗的事），就不能增長那方面的智慧。",
                usage: "常言道：「不經一事，不長一智。」如果沒有經歷過這次考試搞砸的教訓，我就不會明白提早複習的重要性。"
            }
        ];

        const conclusionQuotes = [
            { id: 1, text: '「成功的背後只有堅持，沒有僥倖。」', author: '江振誠（國際名廚）' },
            { id: 2, text: '「我可以接受失敗，但我不能接受『未曾嘗試』。」', author: '麥可‧喬丹（Michael Jordan，籃球之神）' },
            { id: 3, text: '「成功就是從一個失敗走到另一個失敗，卻不失去熱情。」', author: '邱吉爾（Winston Churchill，英國前首相）' }
        ];

        // --- 應用程式狀態 (State Management) ---
        const state = {
            currentLevel: 0,
            showVocab: false,
            showQuoteBag: false,
            formData: {
                stance: null,
                reason: '',
                selectedMentors: [],
                mentorInputs: {},
                quote: null,
                customConclusion: ''
            }
        };

        // --- 核心功能函數 (Logic) ---

        function generateArticle() {
            if (!state.formData.stance) return '';
            
            const intro = `    關於失敗，我有屬於自己的覺醒看法。我認為${state.formData.stance.desc.replace('。', '')}。`;
            const reason = `\n\n    為什麼這麼說呢？因為${state.formData.reason || '...'}。這段經歷讓我們學會了如何調整自己，變得更強大。`;
            
            let evidence = '';
            if (state.formData.selectedMentors.length > 0) {
                evidence = '\n\n';
                state.formData.selectedMentors.forEach((mentor, index) => {
                    const inputs = state.formData.mentorInputs[mentor.id] || { story: '...', lesson: '...' };
                    const transition = index === 0 ? '    首先，舉例來說，' : '\n\n    此外，無獨有偶，';
                    evidence += `${transition}${inputs.story}這讓我學到了${inputs.lesson}`;
                });
            }

            let conclusion = '';
            if (state.formData.quote) {
                conclusion = `\n\n    總而言之，面對挫折我們不應氣餒。正如${state.formData.quote.author}所說：${state.formData.quote.text} ${state.formData.customConclusion || ''}`;
            }

            return `${intro}${reason}${evidence}${conclusion}`;
        }

        function getUserInputText() {
            let text = state.formData.reason;
            if (state.formData.selectedMentors.length > 0) {
                state.formData.selectedMentors.forEach(m => {
                    const input = state.formData.mentorInputs[m.id];
                    if (input) {
                        text += (input.story || '') + (input.lesson || '');
                    }
                });
            }
            text += state.formData.customConclusion;
            return text;
        }

        function calculateEvaluation() {
            const article = generateArticle();
            const currentTotalWordCount = article.replace(/\s/g, '').length;
            const userText = getUserInputText();
            const userWordCount = userText.replace(/\s/g, '').length;
            
            let score = 0;
            let comments = [];

            // 1. Length Check
            if (userWordCount >= 180) {
                score += 40;
                comments.push({ type: 'good', text: `輸出火力強大（手寫 ${userWordCount} 字），你的原創內容非常豐富！` });
            } else if (userWordCount >= 100) {
                score += 30;
                comments.push({ type: 'warn', text: `輸出火力尚可（手寫 ${userWordCount} 字），建議再多描述一些細節會更生動。` });
            } else {
                score += 10;
                comments.push({ type: 'bad', text: "輸出火力不足，太依賴自動生成的文字囉，多寫一點自己的想法吧！" });
            }

            // 2. Keywords Check
            const keywords = ['因為', '所以', '雖然', '但是', '不僅', '而且', '首先', '此外', '總而言之', '正如', '舉例來說', '只要', '就'];
            const foundKeywords = keywords.filter(k => userText.includes(k));
            
            if (foundKeywords.length >= 3) {
                score += 30;
                comments.push({ type: 'good', text: "連招順暢！你在自己的段落中靈活運用了連接詞。" });
            } else if (foundKeywords.length >= 1) {
                score += 20;
                comments.push({ type: 'warn', text: "連招普通。試著在你的句子中加入「雖然...但是...」等複句來增強層次。" });
            } else {
                score += 10;
                comments.push({ type: 'bad', text: "卡招了？你的段落中似乎很少使用連接詞，讀起來可能會不夠流暢。" });
            }

            // 3. Completeness Check
            let completenessScore = 0;
            if (state.formData.reason.length > 10) completenessScore += 10;
            if (state.formData.selectedMentors.length === 2 && 
                state.formData.selectedMentors.every(m => {
                    const inp = state.formData.mentorInputs[m.id];
                    return inp && inp.story.length > 5;
                })) completenessScore += 10;
            if (state.formData.customConclusion.length > 5) completenessScore += 10;
            
            score += completenessScore;
            if (completenessScore < 30) {
                comments.push({ type: 'warn', text: "裝備未齊全，部分關卡似乎寫得比較簡單喔。" });
            } else {
                comments.push({ type: 'good', text: "全套神裝！論點、理由、證據、結論結構完整。" });
            }

            // Determine Rank
            let rank = { label: 'C', title: '新手見習生', color: 'text-slate-400', bg: 'bg-slate-500' };
            if (score >= 90) rank = { label: 'S', title: 'S級傳奇獵人', color: 'text-yellow-400', bg: 'bg-yellow-500' };
            else if (score >= 80) rank = { label: 'A', title: 'A級卓越獵人', color: 'text-purple-400', bg: 'bg-purple-500' };
            else if (score >= 60) rank = { label: 'B', title: 'B級資深獵人', color: 'text-blue-400', bg: 'bg-blue-500' };

            return { score, comments, rank, userWordCount, currentTotalWordCount };
        }

        function isLevelComplete() {
            if (state.currentLevel === 0) return !!state.formData.stance;
            if (state.currentLevel === 1) return state.formData.reason.length > 5;
            if (state.currentLevel === 2) {
                if (state.formData.selectedMentors.length !== 2) return false;
                return state.formData.selectedMentors.every(m => {
                    const input = state.formData.mentorInputs[m.id];
                    return input && input.story.length > 5 && input.lesson.length > 5;
                });
            }
            if (state.currentLevel === 3) return !!state.formData.quote && state.formData.customConclusion.length > 5;
            return true;
        }

        // --- 事件處理 (Event Handlers) ---
        window.actions = {
            setStance: (index) => {
                state.formData.stance = stances[index];
                render();
            },
            updateReason: (value) => {
                state.formData.reason = value;
                renderUpdatesOnly(); // 優化：只更新文字統計等小部分
            },
            toggleMentor: (index) => {
                const mentor = mentors[index];
                const selected = state.formData.selectedMentors;
                const isSelected = selected.find(m => m.id === mentor.id);
                
                if (isSelected) {
                    state.formData.selectedMentors = selected.filter(m => m.id !== mentor.id);
                } else {
                    if (selected.length < 2) {
                        state.formData.selectedMentors.push(mentor);
                        if (!state.formData.mentorInputs[mentor.id]) {
                            state.formData.mentorInputs[mentor.id] = { story: '', lesson: '' };
                        }
                    } else {
                        return; // Max reached
                    }
                }
                render();
            },
            updateMentorInput: (mentorId, field, value) => {
                state.formData.mentorInputs[mentorId][field] = value;
                renderUpdatesOnly();
            },
            setQuote: (index) => {
                state.formData.quote = conclusionQuotes[index];
                render();
            },
            updateConclusion: (value) => {
                state.formData.customConclusion = value;
                renderUpdatesOnly();
            },
            nextLevel: () => {
                if (state.currentLevel < 4) {
                    state.currentLevel++;
                    render();
                }
            },
            prevLevel: () => {
                if (state.currentLevel > 0) {
                    state.currentLevel--;
                    render();
                }
            },
            toggleVocab: () => {
                state.showVocab = !state.showVocab;
                render();
            },
            toggleQuoteBag: () => {
                state.showQuoteBag = !state.showQuoteBag;
                render();
            },
            resetGame: () => {
                state.currentLevel = 0;
                render();
            },
            copyText: () => {
                navigator.clipboard.writeText(generateArticle());
                alert('文章已複製到剪貼簿！');
            }
        };

        // --- 渲染畫面 (Rendering) ---
        
        // 簡單的文字統計更新，避免輸入時整個重繪導致焦點跑掉
        function renderUpdatesOnly() {
           const evalData = calculateEvaluation();
           const counterEl = document.getElementById('word-count-display');
           if(counterEl) {
               counterEl.innerText = evalData.currentTotalWordCount;
               counterEl.className = `font-mono font-bold text-lg ${evalData.currentTotalWordCount >= 350 ? 'text-green-400' : 'text-white'}`;
           }
           // 更新字數提示
           const reasonCount = document.getElementById('reason-count');
           if(reasonCount) reasonCount.innerText = state.formData.reason.length + " 字";
        }

        function render() {
            const app = document.getElementById('app');
            const evalData = calculateEvaluation();
            const levelComplete = isLevelComplete();
            
            // Icon Helper
            const icon = (name, classes = "") => `<i data-lucide="${name}" class="${classes}"></i>`;

            let mainContent = '';

            // --- Level 0: Stance ---
            if (state.currentLevel === 0) {
                mainContent = `
                    <div class="grid gap-4 md:grid-cols-1 animate-fade-in">
                        ${stances.map((s, idx) => {
                            const isSelected = state.formData.stance?.id === s.id;
                            return `
                            <button onclick="actions.setStance(${idx})" 
                                class="relative group p-6 rounded-xl border-2 text-left transition-all duration-300 w-full
                                ${isSelected ? `${s.color} shadow-[0_0_20px_rgba(0,0,0,0.3)] scale-[1.02]` : 'border-slate-700 bg-slate-800 hover:border-slate-500 hover:bg-slate-750'}">
                                <div class="flex items-start gap-4">
                                    <div class="p-3 rounded-lg bg-slate-900 ${isSelected ? 'scale-110' : ''}">
                                        ${icon(s.icon, isSelected ? 'w-8 h-8 text-white' : 'w-8 h-8 text-slate-400')}
                                    </div>
                                    <div>
                                        <h3 class="text-xl font-bold mb-1 ${isSelected ? 'text-white' : 'text-slate-200'}">${s.title}</h3>
                                        <p class="text-slate-400 group-hover:text-slate-300">${s.desc}</p>
                                    </div>
                                </div>
                                ${isSelected ? `<div class="absolute top-4 right-4 text-green-400 animate-pulse">${icon('check-circle', 'w-6 h-6')}</div>` : ''}
                            </button>
                        `}).join('')}
                    </div>
                `;
            }

            // --- Level 1: Reason ---
            else if (state.currentLevel === 1) {
                mainContent = `
                    <div class="bg-slate-800 rounded-xl p-8 border border-slate-700 shadow-xl animate-fade-in">
                        <div class="mb-6 bg-blue-900/30 p-5 rounded-lg border border-blue-500/30">
                            <div class="flex items-start gap-4 mb-3">
                                ${icon('user', 'text-blue-400 shrink-0 w-6 h-6')}
                                <div>
                                    <p class="text-blue-200 text-sm font-bold mb-1">軍師提示：</p>
                                    <p class="text-blue-100 text-base leading-relaxed">${state.formData.stance?.hint || "請說明為什麼失敗能讓你變強。"}</p>
                                </div>
                            </div>
                            <div class="ml-10 pt-3 border-t border-blue-500/20">
                                <p class="text-xs text-blue-300 font-bold mb-2 uppercase tracking-wide">推薦裝備</p>
                                <div class="flex flex-wrap gap-2">
                                    <div class="bg-slate-900/50 p-2 rounded text-green-300 font-mono text-sm border border-slate-700">
                                        複句：${state.formData.stance?.sentencePattern || "因為...，所以..."}
                                    </div>
                                    <button onclick="actions.toggleQuoteBag()" class="bg-indigo-900/50 hover:bg-indigo-900/80 p-2 rounded text-indigo-300 font-mono text-sm border border-indigo-700 flex items-center gap-1 transition-colors">
                                        ${icon('quote', 'w-3 h-3')} 引用名言 (點擊查看)
                                    </button>
                                </div>
                            </div>
                        </div>
                        <label class="block text-lg font-medium text-slate-300 mb-4">你的理由：</label>
                        <div class="relative">
                            <textarea oninput="actions.updateReason(this.value)"
                                class="w-full bg-slate-900 border-2 border-slate-600 rounded-lg p-4 text-white text-lg focus:border-purple-500 focus:ring-2 focus:ring-purple-500/50 outline-none transition-all min-h-[120px]"
                                placeholder="試試看用「${state.formData.stance?.sentencePattern?.split('...')[0]}...」開頭，或是引用一句名言來寫..."
                            >${state.formData.reason}</textarea>
                            <div id="reason-count" class="absolute bottom-4 right-4 text-xs text-slate-500">${state.formData.reason.length} 字</div>
                        </div>
                    </div>
                `;
            }

            // --- Level 2: Evidence ---
            else if (state.currentLevel === 2) {
                const mentorGrid = mentors.map((m, idx) => {
                    const isSelected = state.formData.selectedMentors.find(sel => sel.id === m.id);
                    const isMaxReached = state.formData.selectedMentors.length >= 2;
                    const borderClass = isSelected ? 'border-yellow-500 ring-2 ring-yellow-500/50 shadow-lg scale-[1.02]' : 
                                      (isMaxReached ? 'border-slate-800 opacity-50 grayscale' : 'border-slate-700 hover:border-slate-500 bg-slate-800');
                    
                    return `
                        <div onclick="actions.toggleMentor(${idx})" 
                            class="cursor-pointer rounded-xl overflow-hidden border-2 transition-all duration-300 relative group ${borderClass}">
                            <div class="h-24 ${m.imgColor} flex items-center justify-center relative overflow-hidden">
                                <div class="absolute inset-0 bg-black/20 group-hover:bg-black/0 transition-colors"></div>
                                ${icon(m.icon, 'text-white w-8 h-8')}
                            </div>
                            <div class="p-4 bg-slate-800 relative">
                                <h3 class="font-bold text-lg text-white mb-1">${m.name}</h3>

                            <div class="mt-6 pt-4 border-t border-slate-700 text-center"><p class="text-slate-500 text-xs">點擊畫面空白處關閉</p></div>
                        </div>
                    </div>
                ` : ''}
            `;

            // 重要：每次重繪後，重新載入 Icons
            lucide.createIcons();
        }

        // 初始化渲染
        render();

    </script>
